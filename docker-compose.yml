services:
  postgres:
    image: postgres:16-alpine
    container_name: agentresolve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentresolve
      POSTGRES_PASSWORD: agentresolve
      POSTGRES_DB: agentresolve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentresolve -d agentresolve"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
